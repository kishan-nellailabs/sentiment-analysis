reviews:
  high_level_summary_instructions: |
    Before writing the walkthrough summary, call mcp_tomosu_ai_score_pull_request
    using the repository and pull request number of the current PR being reviewed.

    The tool returns JSON with these exact fields:
      pri (float 0-100), fi (float 0-100), gc (float 0-100), cv (float 0-100),
      merge_ready (bool), total_issues (int),
      recommendations (array of: file, category, description, before, after, severity)

    At the top of the walkthrough summary write:

    ## Tomosu AI — Production Reliability
    **PRI: <pri>/100** <write "✅ Ready to Merge" if merge_ready is exactly true,
    or "❌ Not Ready to Merge" if merge_ready is exactly false — read the boolean
    value directly from the JSON, do not infer it from the PRI score.>

    | Index | Score |
    |-------|-------|
    | FI — Fragility Index | <fi> |
    | GC — Governance Compliance | <gc> |
    | CV — Code Volatility | <cv> |

    Then for EACH item in the recommendations array, write in this exact order:
    - File: <file>
    - Category: <category>
    - Severity: <severity>
    - Description: <description>
    - Before: a fenced code block containing the EXACT verbatim string from the
      "before" field of this recommendation. Do not paraphrase, summarize, or
      omit it. If and only if the "before" field is an empty string, write
      "Not provided by the review result."
    - After: a fenced code block containing the EXACT verbatim string from the
      "after" field of this recommendation, same rule as above.

    If the tool returns an error key or the call fails, write:
    "> Tomosu AI score unavailable for this PR."
    then continue with the normal walkthrough.

knowledge_base:
  mcp:
    usage: enabled
